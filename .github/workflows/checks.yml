name: checks

# Runs the automated "definition of done" on every push to a feature branch
# and on PRs into main. Light by design — no Pipecat install, no API keys.

on:
  push:
    branches: ["feature/**", "feature-*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run verification gate
        run: bash scripts/verify.sh
